<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1000" viewBox="0 0 1600 1000">
<!-- Intro card for section 1 (continents and oceans): approved watercolour world base, coloured continents,
     Equator and Prime Meridian layers, compass rose with north up. No text: the app adds captions. -->
<defs>
 <radialGradient id="paper" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#f7efdc"/><stop offset="1" stop-color="#e9dcc0"/></radialGradient>
 <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#5a4426" flood-opacity=".28"/></filter>
 <clipPath id="mapclip"><rect x="60" y="110" width="1480" height="814.7" rx="22"/></clipPath>
</defs>
<rect width="1600" height="1000" fill="url(#paper)"/>
<rect x="60" y="110" width="1480" height="814.7" rx="22" fill="#b7dcd9" filter="url(#shadow)"/>
<g clip-path="url(#mapclip)">
 <image x="60" y="110" width="1480" height="814.7" xlink:href="../world-base.webp" preserveAspectRatio="none"/>
 <image x="60" y="110" width="1480" height="814.7" xlink:href="../layers/world-continent-asia.webp" preserveAspectRatio="none"/>
 <image x="60" y="110" width="1480" height="814.7" xlink:href="../layers/world-continent-africa.webp" preserveAspectRatio="none"/>
 <image x="60" y="110" width="1480" height="814.7" xlink:href="../layers/world-continent-north-america.webp" preserveAspectRatio="none"/>
 <image x="60" y="110" width="1480" height="814.7" xlink:href="../layers/world-continent-south-america.webp" preserveAspectRatio="none"/>
 <image x="60" y="110" width="1480" height="814.7" xlink:href="../layers/world-continent-antarctica.webp" preserveAspectRatio="none"/>
 <image x="60" y="110" width="1480" height="814.7" xlink:href="../layers/world-continent-europe.webp" preserveAspectRatio="none"/>
 <image x="60" y="110" width="1480" height="814.7" xlink:href="../layers/world-continent-australia.webp" preserveAspectRatio="none"/>
 <image x="60" y="110" width="1480" height="814.7" xlink:href="../layers/world-line-equator.webp" preserveAspectRatio="none"/>
 <image x="60" y="110" width="1480" height="814.7" xlink:href="../layers/world-line-prime-meridian.webp" preserveAspectRatio="none"/>
</g>
<rect x="60" y="110" width="1480" height="814.7" rx="22" fill="none" stroke="#b8924a" stroke-width="6"/>
<rect x="69" y="119" width="1462" height="796.7" rx="15" fill="none" stroke="#b8924a" stroke-width="1.5" opacity=".7"/>
<!-- compass rose: north tip red -->
<g opacity=".95">
 <circle cx="245.0" cy="753.6" r="106" fill="#f4ead6" fill-opacity=".72" stroke="#7a5a2b" stroke-width="3"/>
 <circle cx="245.0" cy="753.6" r="96" fill="none" stroke="#7a5a2b" stroke-width="1.5" stroke-dasharray="4 5"/>
 <polygon points="285.3,713.3 259.7,753.6 285.3,793.9 245.0,768.3 204.7,793.9 230.3,753.6 204.7,713.3 245.0,738.9" fill="#c9a55a" stroke="#7a5a2b" stroke-width="1.5"/>
 <polygon points="245.0,847.4 263.4,753.6 245.0,753.6" fill="#2c5f63"/><polygon points="245.0,847.4 226.6,753.6 245.0,753.6" fill="#3f7c80"/>
 <polygon points="329.6,753.6 245.0,735.2 245.0,753.6" fill="#2c5f63"/><polygon points="329.6,753.6 245.0,772.0 245.0,753.6" fill="#3f7c80"/>
 <polygon points="160.4,753.6 245.0,772.0 245.0,753.6" fill="#2c5f63"/><polygon points="160.4,753.6 245.0,735.2 245.0,753.6" fill="#3f7c80"/>
 <polygon points="245.0,638.6 224.8,753.6 245.0,753.6" fill="#a2342a"/><polygon points="245.0,638.6 265.2,753.6 245.0,753.6" fill="#c4483b"/>
 <circle cx="245.0" cy="753.6" r="9" fill="#f4ead6" stroke="#7a5a2b" stroke-width="3"/>
</g>
</svg>
