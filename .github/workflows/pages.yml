name: Validate and Deploy GeoWords

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check sw.js
          node --check engine/geowords.js
          node --check engine/semantic.js
          node --check data/dictionary.js
          node --check data/rivers-semantics.js
          node --check data/rivers-authored.js
          node --check data/courses.js
          node --check data/authored-answer-index.js

      - name: Validate authored levels
        run: node scripts/validate-levels.mjs

      - name: Validate generated puzzles and seven-word progression
        run: node scripts/validate-generator.mjs

      - name: Validate F1-F4 semantic anchors and non-spoiler vocabulary
        run: node scripts/validate-f4.mjs

      - name: Validate staged L1 and L2 original workbook imports
        run: node scripts/validate-import-staging.mjs

      - name: Check workbook importer and mapping scripts
        run: python3 -m py_compile tools/import_workbooks.py tools/apply_author_mapping.py

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
